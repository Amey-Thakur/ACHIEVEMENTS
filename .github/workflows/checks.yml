# The README is written by hand and its preview column is generated from it.
# These two can disagree the moment a certificate is added, and a disagreement
# is invisible: a row simply has no image, or an image points at a file that
# has moved. This checks both, on every push.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    name: Generated files match the README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Index is current with the README
        run: python .github/scripts/build_index.py --check
      - name: Every certificate table shows its preview
        run: python .github/scripts/build_readme.py --check
      - name: Every file the README links exists
        run: |
          python - <<'PY'
          import re, pathlib, sys, urllib.parse
          BLOB = "https://github.com/Amey-Thakur/ACHIEVEMENTS/blob/main/"
          LINK = re.compile(r"\[([^\]]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)")
          text = pathlib.Path("README.md").read_text(encoding="utf-8")
          broken = []
          for label, href in LINK.findall(text):
              if href.startswith(BLOB):
                  path = href[len(BLOB):]
              elif href.startswith(("http", "#", "mailto")):
                  continue
              else:
                  path = href
              target = pathlib.Path(urllib.parse.unquote(path.split("#")[0]))
              if not target.exists():
                  broken.append(f"[{label}] -> {target}")
          for src in re.findall(r'<img src="([^"]+)"', text):
              if src.startswith("http"):
                  continue
              if not pathlib.Path(urllib.parse.unquote(src)).exists():
                  broken.append(f"image -> {src}")
          for href in re.findall(r'<a href="([^"]+)"', text):
              if href.startswith(("http", "#")):
                  continue
              if not pathlib.Path(urllib.parse.unquote(href)).exists():
                  broken.append(f"anchor -> {href}")
          print(f"{len(broken)} broken reference(s)")
          for b in broken[:20]:
              print(" ", b)
          sys.exit(1 if broken else 0)
          PY

  verification:
    name: Verification links still resolve
    runs-on: ubuntu-latest
    # Two hundred requests to a dozen issuers is not something to run on every
    # push. Weekly is often enough to catch a retired service.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_verify_links.py
